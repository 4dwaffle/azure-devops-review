name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: Version to embed in release packages
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    name: Validate and package
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      REVIEW_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
      RELEASE_VERSION: ${{ inputs.release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            azure-tab/package-lock.json
      - name: Configure test environment and check prerequisites
        run: |
          # Avoid runner profile 8.3 aliases: Git reports long paths for temporary worktrees.
          "TEMP=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if (!(Test-Path $env:REVIEW_BROWSER)) { throw 'Microsoft Edge is required for browser validation.' }
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix azure-tab --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test shared analysis
        run: npm run test:core
      - name: Test Azure DevOps extension
        run: npm test --prefix azure-tab
      - name: Build Azure DevOps extension
        run: npm run build --prefix azure-tab
      - name: Prepare versioned VSIX manifest
        run: |
          $manifestPath = 'azure-tab\vss-extension.package.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { $manifest.version }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $manifest.version = $version
          $manifest | ConvertTo-Json -Depth 30 | Set-Content $manifestPath -Encoding utf8

          New-Item -ItemType Directory -Force 'build\packages' | Out-Null
      - name: Package VSIX
        working-directory: azure-tab
        run: npx --no-install tfx extension create --manifest-globs vss-extension.package.json --output-path ..\build\packages --no-prompt
      - name: Verify release packages
        run: |
          $vsix = @(Get-ChildItem build\packages\*.vsix)
          if ($vsix.Count -ne 1) { throw 'Expected one Azure DevOps VSIX.' }
          Get-ChildItem build\packages\* | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content build\packages\SHA256SUMS.txt -Encoding ascii
          $version = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION } else { (Get-Content azure-tab\vss-extension.json -Raw | ConvertFrom-Json).version }
          ./.github/scripts/Publish-Marketplace.ps1 -PackageDirectory build/packages -Version $version -VerifyOnly
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: build/packages/*
          if-no-files-found: error
          retention-days: 7
