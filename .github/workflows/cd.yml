name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep versioned Marketplace uploads in order when main receives consecutive pushes.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Allocate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Allocate stable version for this run
        id: version
        shell: bash
        run: echo "version=0.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  validate:
    name: Release validation
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release-version: ${{ needs.version.outputs.version }}

  release:
    name: Publish GitHub Release
    needs: [version, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: packages
      - name: Publish validated packages
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          # Re-running a successful publish replaces assets without creating another version.
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* \
              --target "$RELEASE_COMMIT" \
              --title "$tag" \
              --generate-notes
          fi

  marketplace:
    name: Publish private Marketplace extension
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: azure-tab/package-lock.json
      - name: Check Marketplace publishing credential
        shell: pwsh
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          if (!$env:VS_MARKETPLACE_TOKEN) { throw 'Set the VS_MARKETPLACE_TOKEN Actions secret with Marketplace publishing access to publisher VaclavBerny.' }
      - name: Install locked publishing tools
        run: npm ci --prefix azure-tab --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: release-packages
          path: packages
      - name: Publish the validated VSIX to the Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: ./.github/scripts/Publish-Marketplace.ps1 -PackageDirectory packages -Version $env:RELEASE_VERSION
