<!doctype html><html lang="en"><meta charset="utf-8"><title>Browser Roslyn verification</title><h1>Browser Roslyn verification</h1><p id="status">Loading local WebAssembly runtime…</p><pre id="result"></pre><script type="module">
import { WasmSharpModule } from './wasm/index.js';
try {
 const start = performance.now();
 const module = await WasmSharpModule.initializeAsync();
 const cases = {};
 for (const [name, code] of Object.entries({syntax:'class C { void M() { int x = ; } }', unreachable:'class C { void M() { return; System.Console.WriteLine("unreachable"); } }', unusedPrivate:'class C { private void Unused() {} }'})) {
  const compilation = await module.createCompilationAsync(code);
  cases[name] = await compilation.getDiagnosticsAsync();
 }
 window.probeResult = {browserRoslyn:true, milliseconds:Math.round(performance.now()-start), cases};
 document.querySelector('#status').textContent = 'Browser-local diagnostics complete; reviewed code was not executed.';
 document.querySelector('#result').textContent = JSON.stringify(window.probeResult, null, 2);
} catch (error) {window.failure = String(error); document.querySelector('#status').textContent = window.failure;}
</script></html>
